services:
  kiosk-mda:
    build: .
    container_name: kiosk-mda-server
    restart: unless-stopped
    ports:
      - "8989:8989"
    environment:
      - PORT=8989
      - HOST=0.0.0.0
      - DATA_DIR=/data
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD muss gesetzt sein}
    volumes:
      - ./data:/data
